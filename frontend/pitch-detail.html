<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Thông tin sân, tiện ích, đánh giá và lịch trống." />
    <title>Chi tiết sân — Pitch Point</title>
    <script src="js/core/page-bootstrap.js"></script>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pitch-detail.css" />
  </head>
  <body data-page="pitch-detail">
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <site-header></site-header>
    <main class="container stack" id="main">
      <a href="search.html">← Tìm sân</a>
      <div id="pitch" class="surface stack"><p>Đang tải…</p></div>
      <section class="surface stack">
        <h2>Liên hệ và báo cáo</h2>
        <button id="message-owner" class="button" type="button">Nhắn chủ sân</button>
        <form id="report-form" class="stack">
          <label>
            Lý do
            <input name="reason" required />
          </label>
          <label>
            Mô tả
            <textarea name="details" required maxlength="1000"></textarea>
          </label>
          <button class="button">Gửi báo cáo sân</button>
        </form>
      </section>
      <section>
        <h2>Chọn khung giờ</h2>
        <label>
          Ngày
          <input id="date" type="date" />
        </label>
        <p>Chọn các giờ còn trống liền kề.</p>
        <div id="slots" class="grid"></div>
        <p id="selection"></p>
        <button id="book" class="button" disabled>Tiếp tục đặt sân</button>
      </section>
      <p id="error" role="alert"></p>
    </main>
    <site-footer></site-footer>
    <script type="module" src="js/pages/pitch-detail.js"></script>
  </body>
</html>
