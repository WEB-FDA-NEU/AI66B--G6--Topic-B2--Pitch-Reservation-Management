<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Thẻ đỏ — Pitch Point</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f9fa; /* Light grey/white background */
      font-family: var(--font);
      text-align: center;
    }

    .not-found-image {
      max-width: 100%;
      width: 600px;
      height: auto;
      margin-bottom: var(--sp-4);
      object-fit: contain;
    }

    .not-found-title {
      font-size: 2rem;
      font-weight: 800;
      font-style: italic;
      color: #111;
      margin-bottom: var(--sp-2);
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .not-found-desc {
      font-size: 1.125rem;
      color: #444;
      margin-bottom: var(--sp-6);
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #d32f2f; /* Red matching the card */
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.125rem;
      transition: background-color 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-return:hover {
      background-color: #b71c1c;
      transform: translateY(-2px);
    }

    .btn-return svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <img src="img/404-referee.png" alt="Trọng tài giơ thẻ đỏ 404" class="not-found-image">
  
  <h1 class="not-found-title">404 - THẺ ĐỎ TRỰC TIẾP!</h1>
  <p class="not-found-desc">Trang web này đã bị truất quyền thi đấu khỏi hệ thống. Vui lòng rời sân.</p>

  <button class="btn-return" onclick="history.back()">
    <!-- Whistle or back icon -->
    <svg viewBox="0 0 24 24">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
    </svg>
    Về phòng thay đồ
  </button>

</body>
</html>
