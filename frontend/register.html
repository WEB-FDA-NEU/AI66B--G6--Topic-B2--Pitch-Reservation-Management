<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tạo tài khoản khách hàng Pitch Point." />
    <title>Đăng ký — Pitch Point</title>
    <script src="js/core/page-bootstrap.js"></script>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pitch-scene.css" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body data-page="register">
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <site-header></site-header>
    <main class="container stack" id="main">
      <h1>Tạo tài khoản</h1>
      <p>Tạo tài khoản để đặt sân nhanh hơn.</p>
      <form id="auth-form" class="surface stack">
        <label>
          Họ tên
          <input name="full_name" required maxlength="100" />
        </label>
        <label>
          Điện thoại (không bắt buộc)
          <input name="phone" type="tel" />
        </label>
        <label>
          Email
          <input name="email" type="email" required />
        </label>
        <label>
          Mật khẩu
          <input name="password" type="password" minlength="6" required />
        </label>
        <button class="button">Tạo tài khoản</button>
      </form>
      <a href="login.html">Đã có tài khoản? Đăng nhập</a>
      <p id="error" role="alert"></p>
    </main>
    <site-footer></site-footer>
    <script type="module" src="js/pages/register.js"></script>
  </body>
</html>
