<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhật ký hoạt động — Pitch Point</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin-activity-log.css">
</head>
<body>
  <a class="admin-activity-log-skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
  <site-header></site-header>
  <main id="main-content" class="container admin-activity-log-page">
    <nav aria-label="Điều hướng quản trị">
      <a class="btn btn--secondary" href="admin-dashboard.html">← Quay lại bảng điều khiển</a>
    </nav>
    <header><p class="admin-activity-log-page__eyebrow">S34 · Quản trị hệ thống</p><h1>Nhật ký hoạt động</h1><p>Đối chiếu các sự kiện quản trị theo bản ghi chỉ đọc.</p></header>
    <section class="card admin-activity-log-page__filters" aria-labelledby="activity-filter-heading">
      <h2 id="activity-filter-heading">Bộ lọc</h2>
      <form id="activity-filter-form" class="admin-activity-log-page__filter-form">
        <label for="activity-query">Tìm kiếm</label><input id="activity-query" class="input" name="query" type="search" autocomplete="off">
        <label for="activity-entity-type">Loại đối tượng</label><select id="activity-entity-type" class="select" name="entityType"><option value="">Tất cả</option><option value="user">Người dùng</option><option value="manager">Chủ sân</option><option value="report">Báo cáo</option><option value="content">Nội dung</option><option value="settings">Cài đặt</option></select>
        <label for="activity-result">Kết quả</label><select id="activity-result" class="select" name="result"><option value="">Tất cả</option><option value="success">Thành công</option><option value="failed">Thất bại</option></select>
        <button class="btn btn--secondary" type="reset">Đặt lại</button>
      </form>
    </section>
    <section aria-labelledby="activity-result-heading">
      <div class="admin-activity-log-page__result-heading"><h2 id="activity-result-heading">Danh sách sự kiện</h2><p id="activity-count" aria-live="polite"></p></div>
      <div class="admin-activity-log-page__table-wrap"><table><thead><tr><th scope="col">Mã</th><th scope="col">Thời điểm</th><th scope="col">Người thực hiện</th><th scope="col">Hành động</th><th scope="col">Đối tượng</th><th scope="col">Kết quả</th><th scope="col">Chi tiết</th></tr></thead><tbody id="activity-rows"></tbody></table></div>
      <div id="activity-empty" class="empty" hidden>Không có sự kiện phù hợp.</div>
    </section>
  </main>
  <site-footer></site-footer>
  <dialog id="activity-dialog" class="admin-activity-log-page__dialog" aria-labelledby="activity-dialog-title"><form method="dialog" class="admin-activity-log-page__dialog-close"><button class="btn btn--secondary" type="submit">Đóng</button></form><h2 id="activity-dialog-title">Chi tiết sự kiện</h2><dl id="activity-detail" class="admin-activity-log-page__detail"></dl></dialog>
  <template id="tpl-activity-row"><tr><td class="admin-activity-log-page__id"></td><td><time class="admin-activity-log-page__date"></time></td><td class="admin-activity-log-page__actor"></td><td class="admin-activity-log-page__action"></td><td class="admin-activity-log-page__entity"></td><td><span class="admin-activity-log-page__status"></span></td><td><button class="btn btn--secondary admin-activity-log-page__open" type="button">Xem</button></td></tr></template>
  <script type="module" src="js/pages/admin-activity-log.js"></script>
</body>
</html>
