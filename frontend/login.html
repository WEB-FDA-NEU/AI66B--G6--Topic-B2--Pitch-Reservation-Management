<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Đăng nhập tài khoản Pitch Point." />
    <title>Đăng nhập — Pitch Point</title>
    <script src="js/core/page-bootstrap.js"></script>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pitch-scene.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <site-header></site-header>
    <main class="container stack" id="main">
      <h1>Đăng nhập</h1>
      <p>Đăng nhập để đặt sân và theo dõi các đơn của bạn.</p>
      <form id="auth-form" class="surface stack">
        <label>
          Email
          <input name="email" type="email" required autocomplete="email" />
        </label>
        <label>
          Mật khẩu
          <input name="password" type="password" required autocomplete="current-password" />
        </label>
        <button class="button">Đăng nhập</button>
      </form>
      <p class="auth-links">
        <a href="register.html">Tạo tài khoản</a>
        <a href="forgot-password.html">Quên mật khẩu?</a>
      </p>
      <p id="error" role="alert"></p>
    </main>
    <site-footer></site-footer>

    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
