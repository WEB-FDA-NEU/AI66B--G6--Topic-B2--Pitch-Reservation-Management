<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tìm sân theo khu vực, ngày, giờ và loại sân." />
    <title>Tìm sân — Pitch Point</title>
    <script src="js/core/page-bootstrap.js"></script>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/search.css" />
  </head>
  <body data-page="search">
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <site-header></site-header>
    <main class="container stack" id="main">
      <h1>Tìm sân bóng</h1>
      <form id="search-form" class="surface stack">
        <label>
          Khu vực hoặc tên sân
          <input name="q" placeholder="Ví dụ: Cầu Giấy" />
        </label>
        <label>
          Ngày
          <input name="date" type="date" />
        </label>
        <button class="button">Tìm sân</button>
      </form>
      <p id="count"></p>
      <div id="results" class="grid"></div>
      <p id="error" role="alert"></p>
    </main>
    <site-footer></site-footer>
    <script type="module" src="js/pages/search.js"></script>
  </body>
</html>
