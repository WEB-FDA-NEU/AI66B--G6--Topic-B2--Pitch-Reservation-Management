<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tìm kiếm và so sánh sân bóng trên Pitch Point.">
  <title>Tìm sân bóng — Pitch Point</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <site-header active="search"></site-header>

  <nav class="container breadcrumb" aria-label="Đường dẫn">
    <ol>
      <li><a href="index.html">Trang chủ</a></li>
      <li aria-current="page" id="crumb-current">Tìm sân</li>
    </ol>
  </nav>

  <main class="container shop-layout" id="main-content">
    <aside class="shop-sidebar" id="shop-sidebar" aria-label="Bộ lọc sân bóng">
      <form id="filter-form">
        <div class="filter-group">
          <h2 class="filter-group__title">Từ khóa</h2>
          <label class="visually-hidden" for="q">Tên sân hoặc khu vực</label>
          <input class="input" id="q" name="q" type="search" placeholder="Tên sân hoặc khu vực">
        </div>

        <fieldset class="filter-group">
          <legend class="filter-group__title">Loại sân</legend>
          <div class="filter-list">
            <label class="filter-option"><input type="radio" name="pitchType" value="" checked> Tất cả</label>
            <label class="filter-option"><input type="radio" name="pitchType" value="5"> Sân 5 người</label>
            <label class="filter-option"><input type="radio" name="pitchType" value="7"> Sân 7 người</label>
            <label class="filter-option"><input type="radio" name="pitchType" value="11"> Sân 11 người</label>
          </div>
        </fieldset>

        <div class="filter-group">
          <h2 class="filter-group__title">Thời gian chơi</h2>
          <div class="field">
            <label class="field__label" for="date">Ngày</label>
            <input class="input" id="date" name="date" type="date">
          </div>
          <div class="field">
            <label class="field__label" for="time">Giờ bắt đầu</label>
            <input class="input" id="time" name="time" type="time">
          </div>
        </div>

        <div class="filter-group">
          <h2 class="filter-group__title">Giá thuê mỗi giờ</h2>
          <div class="price-range">
            <input class="input" name="min_price" type="number" min="0" step="10000" placeholder="Từ" aria-label="Giá thuê từ">
            <span aria-hidden="true">—</span>
            <input class="input" name="max_price" type="number" min="0" step="10000" placeholder="Đến" aria-label="Giá thuê đến">
          </div>
        </div>

        <div class="filter-group">
          <button class="btn btn--primary" type="submit">Áp dụng</button>
          <button class="btn" type="reset">Xóa bộ lọc</button>
        </div>

        <input type="hidden" name="sort" id="sort-mirror">
      </form>
    </aside>

    <section aria-labelledby="search-results-title">
      <button class="btn filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="shop-sidebar">Bộ lọc</button>

      <header class="toolbar">
        <div>
          <h1 id="search-results-title">Sân bóng phù hợp</h1>
          <p class="toolbar__count" id="result-summary"></p>
        </div>
        <div class="toolbar__sort">
          <label for="sort">Sắp xếp</label>
          <select class="select" id="sort">
            <option value="recommended">Phù hợp nhất</option>
            <option value="rating_desc">Đánh giá cao</option>
            <option value="price_asc">Giá thấp đến cao</option>
            <option value="price_desc">Giá cao đến thấp</option>
          </select>
        </div>
      </header>

      <div class="grid" id="results"></div>
      <nav class="pagination" id="pagination" aria-label="Phân trang kết quả"></nav>
    </section>
  </main>

  <site-footer></site-footer>

  <template id="tpl-card">
    <article class="card">
      <a class="card__link">
        <img class="card__img" src="" alt="" loading="lazy">
        <div class="card__body">
          <h2 class="card__title"></h2>
          <p class="card__meta"></p>
          <p class="card__price"></p>
        </div>
      </a>
      <span class="card__badge"></span>
    </article>
  </template>

  <template id="tpl-empty-state">
    <div class="empty">
      <p class="empty__title"></p>
      <p class="empty__hint"></p>
      <button class="btn empty__action" type="button"></button>
    </div>
  </template>

  <script type="module" src="js/pages/search.js"></script>
</body>
</html>
