<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Thêm sân bóng mới vào danh mục quản lý."><title>Thêm sân — Pitch Point</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/add-pitch.css"></head>
<body><a class="skip-link" href="#main-content">Bỏ qua điều hướng</a><site-header></site-header><nav class="container breadcrumb" aria-label="Đường dẫn"><ol><li><a href="manager-dashboard.html">Tổng quan</a></li><li><a href="manager-pitches.html">Sân của tôi</a></li><li aria-current="page">Thêm sân</li></ol></nav><main class="container add-pitch-page" id="main-content" hidden><header><p>Danh mục quản lý</p><h1>Thêm sân bóng</h1><span>Tạo hồ sơ sân mới thuộc tài khoản quản lý hiện tại.</span></header><form id="pitch-form" novalidate><div class="form-grid"><div class="field"><label class="field__label" for="pitch-name">Tên sân</label><input class="input" id="pitch-name" name="name" required minlength="3"></div><div class="field"><label class="field__label" for="pitch-type">Loại sân</label><select class="select" id="pitch-type" name="type" required><option value="5-a-side">Sân 5 người</option><option value="7-a-side">Sân 7 người</option><option value="11-a-side">Sân 11 người</option></select></div><div class="field form-grid__wide"><label class="field__label" for="pitch-location">Địa chỉ</label><input class="input" id="pitch-location" name="location" required></div><div class="field"><label class="field__label" for="pitch-district">Khu vực</label><input class="input" id="pitch-district" name="district" required></div><div class="field"><label class="field__label" for="pitch-price">Giá mỗi giờ (VND)</label><input class="input" id="pitch-price" name="price" type="number" min="10000" step="10000" required></div><div class="field"><label class="field__label" for="pitch-surface">Mặt sân</label><input class="input" id="pitch-surface" name="surface" value="Cỏ nhân tạo"></div><div class="field"><label class="field__label" for="pitch-services">Dịch vụ</label><input class="input" id="pitch-services" name="services" placeholder="Đèn, nước uống, bãi xe"></div><div class="field form-grid__wide"><label class="field__label" for="pitch-description">Mô tả</label><textarea class="input" id="pitch-description" name="description" rows="5" minlength="20" required></textarea></div></div><p class="form-feedback" id="form-feedback" role="status"></p><div class="form-actions"><a class="btn" href="manager-pitches.html">Huỷ</a><button class="btn btn--primary" type="submit">Lưu sân</button></div></form></main><site-footer></site-footer><script type="module" src="js/pages/add-pitch.js"></script></body></html>
