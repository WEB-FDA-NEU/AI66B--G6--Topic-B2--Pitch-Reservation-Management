<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kiểm tra thông tin đơn trong thời gian giữ chỗ." />
    <title>Xác nhận đặt sân — Pitch Point</title>
    <script src="js/core/page-bootstrap.js"></script>
    <link rel="stylesheet" href="css/reset.css" />

      <h1>Xác nhận đặt sân</h1>
      <div id="booking" class="surface stack"></div>
      <p id="countdown"></p>
      <p>Kiểm tra thông tin và thanh toán đơn đang giữ chỗ.</p>
      <label>
        <input type="checkbox" id="consent" />

      <button id="pay" class="button">Thanh toán</button>
      <p id="error" role="alert"></p>

    <site-footer></site-footer>
    <script type="module" src="js/pages/booking-confirmation.js"></script>
