<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Kiểm duyệt trạng thái vận hành sân bóng."><title>Kiểm duyệt sân — Pitch Point</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/admin-pitch-moderation.css"></head>
<body><a class="skip-link" href="#main-content">Bỏ qua điều hướng</a><site-header></site-header><nav class="container breadcrumb" aria-label="Đường dẫn"><ol><li><a href="admin-dashboard.html">Tổng quan Admin</a></li><li aria-current="page">Kiểm duyệt sân</li></ol></nav><main class="container admin-pitch-moderation-page" id="main-content" hidden><header><div><p>Quản trị hệ thống</p><h1>Kiểm duyệt sân bóng</h1><span>Quyết định xử lý chỉ khả dụng khi có báo cáo đang được rà soát.</span></div><a class="btn" href="admin-dashboard.html">Về dashboard</a></header><form class="moderation-filter" id="filter-form"><div class="field"><label class="field__label" for="filter-query">Tìm sân</label><input class="input" id="filter-query" name="query" type="search"></div><div class="field"><label class="field__label" for="filter-status">Trạng thái</label><select class="select" id="filter-status" name="status"><option value="">Tất cả</option><option value="active">Đang mở</option><option value="deactivated">Tạm ngừng</option><option value="suspended">Đình chỉ tạm thời</option><option value="permanently-suspended">Đình chỉ vĩnh viễn</option></select></div><button class="btn btn--primary" type="submit">Lọc</button></form><div class="moderation-layout"><section aria-labelledby="pitch-list-title"><h2 id="pitch-list-title">Danh sách sân</h2><div class="moderation-list" id="pitch-list"></div></section><aside class="moderation-panel" id="moderation-panel" aria-labelledby="decision-title"><h2 id="decision-title">Quyết định xử lý</h2><p id="selected-pitch">Chọn một sân để xem chi tiết.</p><form id="decision-form" hidden><div class="field"><label class="field__label" for="reviewed-report">Báo cáo đã rà soát</label><select class="select" id="reviewed-report" name="reviewedReportId" required></select></div><div class="field"><label class="field__label" for="moderation-action">Hành động</label><select class="select" id="moderation-action" name="action" required><option value="suspend-temporary">Đình chỉ tạm thời</option><option value="suspend-permanent">Đình chỉ vĩnh viễn</option><option value="restore">Khôi phục sân</option></select></div><div class="field"><label class="field__label" for="moderation-reason">Lý do</label><textarea class="input" id="moderation-reason" name="reason" rows="4" minlength="8" required></textarea></div><label class="decision-confirm"><input name="confirmed" type="checkbox" required> Tôi xác nhận đã rà soát căn cứ và hậu quả của quyết định.</label><button class="btn btn--primary" type="submit">Áp dụng quyết định</button></form><p class="moderation-feedback" id="moderation-feedback" role="status"></p></aside></div></main><site-footer></site-footer><template id="tpl-moderation-pitch"><button class="moderation-item" type="button"><span><strong></strong><small></small></span><em></em></button></template><script type="module" src="js/pages/admin-pitch-moderation.js"></script></body></html>
